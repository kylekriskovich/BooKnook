services:
  booknook:
    # Builds straight from GitHub rather than a local checkout — deploying only needs this file
    # (plus .env) present, not a full clone. Tracks the `latest` tag (a moving pointer, not a
    # branch) rather than `main` directly, so a release is only "live" once that tag is
    # deliberately moved — see the Releasing a new version section in SETUP.md.
    build:
      context: https://github.com/kylekriskovich/BooKnook.git#latest
    container_name: booknook
    restart: unless-stopped
    # Host-side port comes from TBR_PORT (see .env.example), defaulting to 8011 if unset.
    # Reached via the host's LAN IP + published port from your reverse proxy's host config.
    ports:
      - "${TBR_PORT:-8011}:8000"
    environment:
      # Where TBR sends login attempts (see .env.example) and the key used to sign session
      # cookies — both required for real Grimmory-backed login to work.
      - GRIMMORY_BASE_URL=${GRIMMORY_BASE_URL}
      - TBR_SECRET_KEY=${TBR_SECRET_KEY}
      # Grimmory username whose nav settings icon shortcuts to /admin (UI convenience only —
      # /admin itself is still gated externally, not by this).
      - TBR_ADMIN_USERNAME=${TBR_ADMIN_USERNAME}
      # Log level, including every Grimmory API call/response (see app/grimmory_http.py).
      - TBR_LOG_LEVEL=${TBR_LOG_LEVEL:-INFO}
    volumes:
      - booknook-data:/data

volumes:
  booknook-data:
