name: CI

# Runs on every PR into main/develop (and on pushes to them, so a direct push or a merge commit
# is checked too) - branch protection on both branches requires these two jobs to pass before a
# PR can be merged (see repo settings).
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest

  frontend-check:
    name: Frontend check (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: openapi-typescript's peer range is behind the project's actual
      # typescript version - see the Dockerfile's frontend-build stage for the same flag.
      - run: npm ci --legacy-peer-deps
        working-directory: frontend

      - run: npm run check
        working-directory: frontend
